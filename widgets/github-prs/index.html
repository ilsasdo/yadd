<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>GitHub pull requests</title>
    <style>
      [hidden] {
        display: none !important;
      }

      html, body {
        height: 100%;
        margin: 0;
      }

      body {
        display: flex;
        flex-direction: column;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 13px;
        color: #1f2933;
      }

      .summary {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 6px 10px;
        border-bottom: 1px solid #eef0f3;
        color: #6b7785;
        font-size: 12px;
      }

      .summary span {
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }

      .refresh {
        flex: none;
        border: 0;
        background: none;
        color: inherit;
        font-size: 14px;
        cursor: pointer;
        padding: 0 2px;
      }

      .refresh:hover {
        color: #1f2933;
      }

      .refresh:disabled {
        opacity: 0.4;
        cursor: default;
      }

      #list {
        flex: 1;
        margin: 0;
        padding: 0;
        list-style: none;
        overflow-y: auto;
      }

      .pr {
        display: flex;
        align-items: flex-start;
        gap: 8px;
        padding: 7px 10px;
        border-bottom: 1px solid #f3f4f6;
      }

      .pr-main {
        flex: 1;
        min-width: 0;
      }

      .pr-title {
        display: block;
        color: #1f2933;
        font-weight: 500;
        text-decoration: none;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }

      .pr-title:hover {
        color: #2f6fed;
        text-decoration: underline;
      }

      .pr-meta {
        color: #6b7785;
        font-size: 11px;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }

      .badge {
        flex: none;
        padding: 1px 7px;
        border-radius: 999px;
        font-size: 11px;
        font-weight: 600;
        line-height: 18px;
        color: #fff;
      }

      .badge.open { background: #1f883d; }
      .badge.draft { background: #6e7781; }
      .badge.merged { background: #8250df; }
      .badge.closed { background: #cf222e; }

      .checks {
        display: inline-block;
        width: 7px;
        height: 7px;
        margin-right: 4px;
        border-radius: 50%;
        vertical-align: 1px;
      }

      .checks.success { background: #1f883d; }
      .checks.failure, .checks.error { background: #cf222e; }
      .checks.pending, .checks.expected { background: #d4a72c; }

      .message {
        flex: 1;
        display: grid;
        place-items: center;
        margin: 0;
        padding: 12px;
        color: #6b7785;
        text-align: center;
        overflow-wrap: anywhere;
      }

      .message.error {
        color: #cf222e;
      }
    </style>
    <script src="../sdk.js"></script>
    <script src="widget.js" defer></script>
  </head>
  <body>
    <div class="summary">
      <span id="summary">Loading…</span>
      <button id="refresh" class="refresh" type="button" title="Refresh" aria-label="Refresh">↻</button>
    </div>
    <p id="message" class="message" hidden></p>
    <ul id="list" hidden></ul>
  </body>
</html>
